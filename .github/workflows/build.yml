name: Compilar Proyecto Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compilar con Gradle y NDK
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar tu repositorio en el servidor de GitHub
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Java (necesario para que corra Gradle)
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Dar permisos de ejecución a los scripts de Gradle
      - name: Dar permisos a Gradle
        run: chmod +x gradlew
        continue-on-error: true

      # 4. Compilar el APK de depuración (Gradle detectará tu CMake y compilará el C++ con el NDK automáticamente)
      - name: Compilar Debug APK
        run: ./gradlew assembleDebug

      # 5. Guardar el archivo APK generado como un artefacto descargable en la interfaz de GitHub
      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

